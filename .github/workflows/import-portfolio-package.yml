name: Import approved Indravansh banner

on:
  push:
    branches: [version-2]
    paths: [.github/workflows/import-portfolio-package.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: portfolio-asset-import
  cancel-in-progress: false

jobs:
  import:
    if: contains(github.event.head_commit.message, '[portfolio-import]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-2
          fetch-depth: 1
      - name: Import reviewed banner changes
        env:
          IMPORT_URL: "https://search.clickup-au.com/workspaces/90161376302/files/JtJ59KhUIlLK0DKaawJtqBmxn4LD-ASTwN7B7zsUN8E"
          EXPECTED_SHA256: "0afe20defa039b65d5f9aa30689d2e200893a6b2c7801e26d1496092c3e9ffd2"
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, io, json, os, urllib.request, zipfile
          data = urllib.request.urlopen(os.environ['IMPORT_URL'], timeout=120).read()
          assert hashlib.sha256(data).hexdigest() == os.environ['EXPECTED_SHA256'], 'Package checksum mismatch'
          archive = zipfile.ZipFile(io.BytesIO(data))
          manifest = json.loads(archive.read('_import-manifest.json'))
          allowed = {'build_version2.py', 'assets/css/version2.css'}
          assert len(manifest) == 2 and len(archive.infolist()) == 3
          assert {x['path'] for x in manifest} == allowed
          assert {x.filename for x in archive.infolist()} == allowed | {'_import-manifest.json'}
          for entry in manifest:
              rel = PurePosixPath(entry['path'])
              assert not rel.is_absolute() and '..' not in rel.parts
              payload = archive.read(str(rel))
              assert hashlib.sha256(payload).hexdigest() == entry['sha256']
              path = Path(str(rel))
              assert path.exists()
              assert hashlib.sha256(path.read_bytes()).hexdigest() in {entry['before_sha256'], entry['sha256']}, f'New changes detected: {rel}'
          for entry in manifest:
              Path(entry['path']).write_bytes(archive.read(entry['path']))
          print('Imported two approved banner files. Original images preserved.')
          PY
      - name: Commit approved files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_version2.py assets/css/version2.css
          git commit -m "Set Indravansh banner to bracelet, earring and larger full-length portrait"
          git push origin HEAD:version-2
      - name: Rebuild both live paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run compare.yml --ref main --repo "$GITHUB_REPOSITORY"
