name: Import reviewed speed and mobile fixes

on:
  push:
    branches: [perf/mobile-speed]
    paths: [.github/workflows/import-portfolio-package.yml]

permissions:
  contents: write

concurrency:
  group: portfolio-asset-import
  cancel-in-progress: false

jobs:
  import:
    if: contains(github.event.head_commit.message, '[portfolio-import]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/mobile-speed
          fetch-depth: 1
      - name: Validate all reviewed files before writing
        env:
          IMPORT_URL: "https://search.clickup-au.com/workspaces/90161376302/files/LNFghJKr-ljtmR6jNGpewUJpUbqq5PwXMm6E2jiYELI"
          EXPECTED_SHA256: "7830d6032f29c444c06c7aa46814b925ffff43dbe406bcc83cd24b1a62bb8de6"
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, io, json, os, urllib.request, zipfile
          payload = urllib.request.urlopen(os.environ["IMPORT_URL"], timeout=120).read()
          assert hashlib.sha256(payload).hexdigest() == os.environ["EXPECTED_SHA256"], "Package checksum mismatch"
          archive = zipfile.ZipFile(io.BytesIO(payload))
          manifest = json.loads(archive.read("_import-manifest.json"))
          allowed = {
              "build_version2.py", "assets/css/version2.css", "assets/css/premium-motion.css",
              "assets/css/style.css", "assets/js/main.js", "assets/js/site-ui.js",
              "src/premium-motion.ts", "src/smooth-scroll.ts", "src/portfolio-motion.tsx",
              "package.json", "scripts/export_site.py", "vercel.json",
          }
          assert len(manifest) == 12 and len(archive.infolist()) == 13
          assert {entry["path"] for entry in manifest} == allowed
          assert {entry.filename for entry in archive.infolist()} == allowed | {"_import-manifest.json"}
          for entry in manifest:
              relative = PurePosixPath(entry["path"])
              assert not relative.is_absolute() and ".." not in relative.parts and not str(relative).startswith(".github/")
              data = archive.read(str(relative))
              assert hashlib.sha256(data).hexdigest() == entry["sha256"], relative
              path = Path(str(relative))
              if path.exists():
                  assert hashlib.sha256(path.read_bytes()).hexdigest() in {entry["before_sha256"], entry["sha256"]}, f"Source changed: {relative}"
              else:
                  assert entry["before_sha256"] is None, f"Expected source disappeared: {relative}"
          for entry in manifest:
              path = Path(entry["path"])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(archive.read(entry["path"]))
          print("Imported twelve reviewed files. Nothing else was changed or deleted.")
          PY
      - name: Commit the reviewed source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_version2.py assets/css/version2.css assets/css/premium-motion.css assets/css/style.css assets/js/main.js assets/js/site-ui.js src/premium-motion.ts src/smooth-scroll.ts src/portfolio-motion.tsx package.json scripts/export_site.py vercel.json
          git diff --cached --quiet || git commit -m "Speed: CSS-first entrance, self-hosted fonts, one stylesheet, responsive images, Preact footer; mobile menu; inline contact form status; security headers"
          git push origin HEAD:perf/mobile-speed
