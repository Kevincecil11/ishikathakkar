name: Import approved Trinity image update

on:
  push:
    branches: [version-2]
    paths: [.github/workflows/import-portfolio-package.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: portfolio-asset-import
  cancel-in-progress: false

jobs:
  import:
    if: contains(github.event.head_commit.message, '[portfolio-import]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-2
          fetch-depth: 1
      - name: Import reviewed Trinity changes
        env:
          IMPORT_URL: "https://search.clickup-au.com/workspaces/90161376302/files/BeDnfliR403b506bYN79ni55fhd26qxmgW32BsCKti0"
          EXPECTED_SHA256: "dd8a4d767dd5db04437a11252adc4605fad1df18aa4f3d96955bd49b0742f416"
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, io, json, os, urllib.request, zipfile
          data = urllib.request.urlopen(os.environ['IMPORT_URL'], timeout=120).read()
          assert hashlib.sha256(data).hexdigest() == os.environ['EXPECTED_SHA256'], 'Package checksum mismatch'
          archive = zipfile.ZipFile(io.BytesIO(data))
          manifest = json.loads(archive.read('_import-manifest.json'))
          assert len(manifest) == 4 and len(archive.infolist()) == 5
          allowed = {'build_version2.py', 'assets/css/version2.css', 'assets/img/trinity-annual-function-speaking-one.webp', 'assets/img/trinity-annual-function-speaking-two.webp'}
          assert {x['path'] for x in manifest} == allowed
          assert {x.filename for x in archive.infolist()} == allowed | {'_import-manifest.json'}
          for entry in manifest:
              rel = PurePosixPath(entry['path'])
              assert not rel.is_absolute() and '..' not in rel.parts
              payload = archive.read(str(rel))
              assert hashlib.sha256(payload).hexdigest() == entry['sha256']
              path = Path(str(rel))
              if path.exists():
                  assert hashlib.sha256(path.read_bytes()).hexdigest() in {entry['before_sha256'], entry['sha256']}, f'New changes detected: {rel}'
              else:
                  assert entry['before_sha256'] is None
          for entry in manifest:
              path = Path(entry['path'])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(archive.read(entry['path']))
          print('Imported four approved Trinity files. Originals preserved.')
          PY
      - name: Commit approved files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_version2.py assets/css/version2.css assets/img/trinity-annual-function-speaking-one.webp assets/img/trinity-annual-function-speaking-two.webp
          git commit -m "Improve Trinity photo clarity and stop stretching low-resolution originals"
          git push origin HEAD:version-2
      - name: Rebuild both live paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run compare.yml --ref main --repo "$GITHUB_REPOSITORY"
