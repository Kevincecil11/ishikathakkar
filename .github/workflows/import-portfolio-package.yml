name: Import approved covers and circular physics

on:
  push:
    branches: [version-2]
    paths: [.github/workflows/import-portfolio-package.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: portfolio-asset-import
  cancel-in-progress: false

jobs:
  import:
    if: contains(github.event.head_commit.message, '[covers-loop-import]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-2
          fetch-depth: 1
      - name: Import the approved covers and physics source
        env:
          IMPORT_URL: "https://search.clickup-au.com/workspaces/90161376302/files/w-wu3nR1Jyv-8kVp53_LWi4iLAEL0VTvQZPbNkVx1q4"
          EXPECTED_SHA256: "f62bdfbe6190bf60d5f00e41c4a38cc620ad6a4fff3c935f7e52167b747e29ce"
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, io, json, os, urllib.request, zipfile
          data = urllib.request.urlopen(os.environ['IMPORT_URL'], timeout=120).read()
          assert hashlib.sha256(data).hexdigest() == os.environ['EXPECTED_SHA256'], 'Package checksum mismatch'
          archive = zipfile.ZipFile(io.BytesIO(data))
          manifest = json.loads(archive.read('_import-manifest.json'))
          assert len(manifest) == 8
          assert {x.filename for x in archive.infolist()} == {x['path'] for x in manifest} | {'_import-manifest.json'}
          for entry in manifest:
              rel = PurePosixPath(entry['path'])
              assert not rel.is_absolute() and '..' not in rel.parts and not str(rel).startswith('.github/')
              payload = archive.read(str(rel))
              assert hashlib.sha256(payload).hexdigest() == entry['sha256']
              path = Path(str(rel))
              if path.exists():
                  assert hashlib.sha256(path.read_bytes()).hexdigest() in {entry['before_sha256'], entry['sha256']}, f'New changes detected: {rel}'
              else:
                  assert entry['before_sha256'] is None, f'Expected source disappeared: {rel}'
          for entry in manifest:
              path = Path(entry['path'])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(archive.read(entry['path']))
          print('Imported 8 reviewed cover, physics and documentation files.')
          PY
      - name: Commit the approved update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INTEGRATION.md UPLOAD-IMAGES.md assets/css/logo-physics.css assets/img/stax-living-interior.webp assets/img/designecho-editorial-stationery.webp assets/img/finance-solutions-advisory.webp build_version2.py src/logo-physics.ts
          git commit -m "Use representative brand covers and loop direct logo physics in a circle"
          git push origin HEAD:version-2
      - name: Rebuild both live paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run compare.yml --ref main --repo "$GITHUB_REPOSITORY"
