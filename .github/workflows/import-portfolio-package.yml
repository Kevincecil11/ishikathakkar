name: Import approved Stax and Mitti media update

on:
  push:
    branches: [version-2]
    paths: [.github/workflows/import-portfolio-package.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: portfolio-asset-import
  cancel-in-progress: false

jobs:
  import:
    if: contains(github.event.head_commit.message, '[portfolio-import]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-2
          fetch-depth: 1
      - name: Validate all reviewed files before writing
        env:
          IMPORT_URL: "https://search.clickup-au.com/workspaces/90161376302/files/6il4dG0-vTwJbzHgg61vYSMsrynysh07NDKmo0C0XbE"
          EXPECTED_SHA256: "a7c0a2388b59f41280378650e90c738ded6cd4600f1a0c899eea63a7c6ff11cd"
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, io, json, os, urllib.request, zipfile
          payload = urllib.request.urlopen(os.environ["IMPORT_URL"], timeout=120).read()
          assert hashlib.sha256(payload).hexdigest() == os.environ["EXPECTED_SHA256"], "Package checksum mismatch"
          archive = zipfile.ZipFile(io.BytesIO(payload))
          manifest = json.loads(archive.read("_import-manifest.json"))
          allowed = {
              "build_version2.py",
              "assets/css/version2.css",
              "src/gallery-layout.ts",
              "assets/img/stax-ronin-bench.webp",
              "assets/img/stax-brava-armchair.webp",
              "assets/img/stax-material-narratives.webp",
              "assets/img/stax-verdura-wing-shelf.webp",
              "assets/img/stax-gallery-campaign.webp",
              "assets/img/stax-intentional-spaces.webp",
              "assets/img/stax-honest-materials.webp",
              "assets/img/stax-art-of-living.webp",
              "assets/img/stax-customisation.webp",
              "assets/img/stax-chair-balloon.webp",
              "assets/img/mitti-workshop-film-poster.webp",
              "assets/video/mitti/workshop-film.mp4",
          }
          assert len(manifest) == 15 and len(archive.infolist()) == 16
          assert {entry["path"] for entry in manifest} == allowed
          assert {entry.filename for entry in archive.infolist()} == allowed | {"_import-manifest.json"}
          for entry in manifest:
              relative = PurePosixPath(entry["path"])
              assert not relative.is_absolute() and ".." not in relative.parts and not str(relative).startswith(".github/")
              data = archive.read(str(relative))
              assert hashlib.sha256(data).hexdigest() == entry["sha256"], relative
              path = Path(str(relative))
              if path.exists():
                  assert hashlib.sha256(path.read_bytes()).hexdigest() in {entry["before_sha256"], entry["sha256"]}, f"Source changed: {relative}"
              else:
                  assert entry["before_sha256"] is None, f"Expected source disappeared: {relative}"
          for entry in manifest:
              path = Path(entry["path"])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(archive.read(entry["path"]))
          print("Imported fifteen reviewed files. No source images or other files were deleted.")
          PY
      - name: Commit the reviewed source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_version2.py assets/css/version2.css src/gallery-layout.ts assets/img/stax-ronin-bench.webp assets/img/stax-brava-armchair.webp assets/img/stax-material-narratives.webp assets/img/stax-verdura-wing-shelf.webp assets/img/stax-gallery-campaign.webp assets/img/stax-intentional-spaces.webp assets/img/stax-honest-materials.webp assets/img/stax-art-of-living.webp assets/img/stax-customisation.webp assets/img/stax-chair-balloon.webp assets/img/mitti-workshop-film-poster.webp assets/video/mitti/workshop-film.mp4
          git diff --cached --quiet || git commit -m "Use supplied Stax three-image banner and extended gallery; add click-to-play Mitti workshop film"
          git push origin HEAD:version-2
      - name: Rebuild both live paths without changing V1 sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run compare.yml --ref main --repo "$GITHUB_REPOSITORY"
