name: Validate V2 production build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --no-audit --no-fund
      - run: python3 -m pip install -r requirements-images.txt
      - run: npm run build
      - run: python3 scripts/export_site.py
      - run: python3 scripts/share_preview.py
