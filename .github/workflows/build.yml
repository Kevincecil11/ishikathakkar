name: Reconcile V2 promotion preparation

on:
  push:
    branches: [promote/v2-to-main]
    paths: [.github/workflows/build.yml]

permissions:
  contents: write

jobs:
  reconcile:
    if: contains(github.event.head_commit.message, '[reconcile-promotion]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote/v2-to-main
          fetch-depth: 1
      - name: Restore only the two shared legacy files from preserved main
        run: |
          git fetch origin main version-1 --depth=1
          test "$(git rev-parse origin/main)" = "a47bff389e059c65ab646d6ccf9c05b9a75cbe77"
          test "$(git rev-parse origin/version-1)" = "a47bff389e059c65ab646d6ccf9c05b9a75cbe77"
          git show origin/main:build.py > build.py
          git show origin/main:index.html > index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.py index.html
          git diff --cached --quiet || git commit -m "Reconcile shared V1 base files; V2 generator and assets unchanged"
          git push origin HEAD:promote/v2-to-main
